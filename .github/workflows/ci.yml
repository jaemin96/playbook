name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # turbo --affected 가 base 브랜치와 비교하려면 필요

      - uses: pnpm/action-setup@v4 # package.json 의 packageManager(pnpm@10.17.1) 사용

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Biome
        run: pnpm biome ci .

      - name: Typecheck / Test (affected only)
        run: pnpm turbo run typecheck test --affected --output-logs=errors-only
