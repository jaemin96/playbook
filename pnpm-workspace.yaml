packages:
  - "packages/*"
  - "apps/*"

# 공통 의존성 버전은 여기서만 관리합니다.
# 각 앱/패키지는 package.json에서 "<name>": "catalog:" 로 가져다 씁니다.
catalog:
  react: ^19.2.0
  react-dom: ^19.2.0
  vite: ^7.2.4
  "@vitejs/plugin-react": ^5.1.1
  tailwindcss: ^4.1.18
  "@tailwindcss/vite": ^4.1.18
  typescript: ^5.9.3
  "@types/node": ^24.10.1
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
  vitest: ^3.2.4
  "@vitest/coverage-v8": ^3.2.4
  jsdom: ^26.1.0

# lefthook 의 postinstall 은 쓰지 않고 루트 prepare 스크립트로 hook 을 설치합니다.
ignoredBuiltDependencies:
  - lefthook
